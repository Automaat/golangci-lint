name: Fork release
on:
  push:
    tags:
      - 'v*-automaat.*'
  pull_request:
  schedule:
    # Upstream syncs bump requirements without triggering PR workflows.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: '1.27.0'

jobs:
  # Each replaced module must patch exactly the version upstream requires,
  # otherwise an upstream bump is silently shadowed by an older fork.
  fork-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check replaced modules match required versions
        run: |
          mods="$(go list -m -f '{{.Path}} {{.Version}} {{with .Replace}}{{.Version}}{{end}}' golang.org/x/tools honnef.co/go/tools)"
          status=0
          while read -r path required replaced; do
            case "${replaced}" in
              "${required}"-automaat.*) echo "ok: ${path} ${required} => ${replaced}" ;;
              *) echo "::error::${path} requires ${required} but is replaced by ${replaced:-nothing}; rebase the fork patches onto ${required}"; status=1 ;;
            esac
          done <<< "${mods}"
          exit "${status}"

  release:
    if: github.repository == 'Automaat/golangci-lint' && startsWith(github.ref, 'refs/tags/')
    needs: fork-deps
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Create release
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --config .goreleaser.automaat.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/golangci-lint-${{ fromJSON(steps.goreleaser.outputs.metadata).version }}-checksums.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
