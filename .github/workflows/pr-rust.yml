name: Rust
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --all-targets --locked
      - name: Build release supervisor
        working-directory: rust
        run: cargo build --release --locked --bin golangci-supervisor
