[package]
name = "golangci-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "golangci-supervisor"

[dependencies]
command-group.workspace = true
ctrlc.workspace = true
golangci-protocol = { path = "../golangci-protocol" }
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Threading"] }

[[bin]]
name = "golangci-supervisor"
path = "src/main.rs"

[[bin]]
name = "supervisor-fixture"
path = "src/bin/supervisor_fixture.rs"
test = false
